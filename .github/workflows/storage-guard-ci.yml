name: Storage Guard CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/storage-guard-ci.yml'
      - 'lib/db/us-analytics.ts'
      - 'lib/storage/**'
      - 'app/dev/sma-dynamics/**'
      - 'components/stock/sma-dynamics/**'
      - 'lib/sma-dynamics*.ts'
      - 'lib/release/**'
      - 'scripts/deploy-web-analog-only.ts'
      - 'scripts/test-sma-release-*.ts'
      - 'scripts/test-sma-dynamics*.ts'
      - 'scripts/test-web-analog-release.ts'
      - 'scripts/test-storage-*.ts'
      - 'scripts/test-us-automation-foundation.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-guard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-guard:
    name: Storage Guard / Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Storage Guard regression
        run: npm run storage:guard-test

      - name: SMA Dynamics regression
        run: npm run test:sma-dynamics:all

      - name: Web and Analog release isolation
        run: npm run test:web-analog-release

      - name: US analytics isolation regression
        run: npm run test:us-analytics-generation

      - name: US automation contract
        run: npx tsx scripts/test-us-automation-foundation.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          STOCKBOARD_BUILD_CPUS: '1'

      - name: Diff whitespace check
        run: git diff --check
