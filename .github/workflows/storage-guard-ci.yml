name: Storage Guard CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/storage-guard-ci.yml'
      - 'app/**'
      - 'components/research/SixStageEventPathLab.tsx'
      - 'components/stock/sma-dynamics/**'
      - 'components/us/stock-detail/UsChartWorkspace.tsx'
      - 'lib/chart-colors.ts'
      - 'lib/db/client.ts'
      - 'lib/db/us-analytics.ts'
      - 'lib/markets.ts'
      - 'lib/research/six-stage-current-serving-projection-fixture.ts'
      - 'lib/runtime/**'
      - 'lib/server/jp-market-calendar.ts'
      - 'lib/server/period-explorer-read-model.ts'
      - 'lib/server/us-*.ts'
      - 'lib/server/us-data-freshness.ts'
      - 'lib/queries/us-*.ts'
      - 'lib/us-*.ts'
      - 'lib/sma-dynamics*.ts'
      - 'lib/storage/**'
      - 'lib/timeframes.ts'
      - 'lib/large-holders/release-preflight.ts'
      - 'proxy.ts'
      - 'scripts/install-*.ts'
      - 'scripts/lib/launchagent-*.ts'
      - 'scripts/run-isolated-runtime.ts'
      - 'scripts/test-runtime-isolation.ts'
      - 'scripts/test-large-holder-release-preflight.ts'
      - 'scripts/test-sma-dynamics*.ts'
      - 'scripts/test-storage-*.ts'
      - 'scripts/test-us-*.ts'
      - 'scripts/audit-us-jp-parity.ts'
      - 'scripts/build-us-jp-parity-board.ts'
      - 'scripts/test-us-automation-foundation.ts'
      - 'docs/us-stockboard-parity-*'
      - 'types/stock.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-guard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-guard:
    name: Storage Guard / Build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Storage Guard regression
        run: npm run storage:guard-test

      - name: Development and test isolation regression
        run: npm run test:runtime-isolation

      - name: SMA Dynamics regression
        run: npm run test:sma-dynamics:all

      - name: Weekly backup policy and writer hold
        run: npm run test:weekly-backup-policy && npm run test:weekly-writer-hold && npm run test:weekly-backup-runner

      - name: JP OHLCV repair transaction and runtime drift
        run: npm run test:jp-ohlcv-gap-repair && npm run test:jp-ohlcv-production-repair && npm run test:jp-ohlcv-runtime-snapshot && npm run test:jp-ohlcv-command-adapter && npm run test:jp-ohlcv-executable-plan-e2e

      - name: Large Holder release preflight
        run: npm run test:large-holder-release-preflight

      - name: US analytics isolation regression
        run: npm run test:us-analytics-generation

      - name: US automation contract
        run: npx tsx scripts/test-us-automation-foundation.ts

      - name: US and JP parity contracts
        run: npm run test:us-parity:targeted

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Poisoned isolated build
        run: npm run build:isolated
        env:
          STOCKBOARD_BUILD_CPUS: '1'
          TURSO_DATABASE_URL: 'libsql://production.invalid'
          TURSO_AUTH_TOKEN: 'poison-production-token'
          STOCKBOARD_DB_PATH: '/Volumes/Production/stockboard.db'
          LOCAL_DB_PATH: '/Volumes/Production/stockboard.db'
          US_ANALYTICS_DB_PATH: '/Volumes/Production/stockboard-us.db'
          STOCK_DATA_MOUNT_PATH: '/Volumes/Production'
          STOCK_DATA_VOLUME_UUID: 'poison-production-volume'
          STOCK_DATA_INCIDENT_DIR: '/tmp/stockboard-production-incidents-poison'
          JQUANTS_API_KEY: 'poison-production-jquants-key'
          OPENAI_API_KEY: 'poison-production-openai-key'

      - name: Diff whitespace check
        run: git diff --check
