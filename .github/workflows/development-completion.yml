name: Development completion

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  completion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify PR base and inspected HEAD
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$EXPECTED_BASE" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@10.9.9 && node --version && npm --version
      - run: npm ci
      - name: Typecheck, changed-file lint, regression, and build
        env:
          WORKFLOW_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: >-
          npm run workflow:verify --
          --select-tests
          --base="$WORKFLOW_BASE"
          --report=${{ runner.temp }}/development-completion-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: development-completion-report
          path: ${{ runner.temp }}/development-completion-report.json
          if-no-files-found: warn
